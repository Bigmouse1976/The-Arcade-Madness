<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris - The Arcade Madness</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Press Start 2P', cursive;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #00F0FF;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Scanline effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1000;
        }

        .game-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            gap: 1.5rem;
            padding: 1rem;
            max-width: 100%;
        }

        .main-game {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: clamp(1.2rem, 3vw, 2rem);
            color: #FF10F0;
            text-shadow: 
                0 0 10px #FF10F0,
                0 0 20px #FF10F0,
                0 0 30px #FF10F0;
            margin-bottom: 0.8rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        #gameCanvas {
            display: block;
            background: #000000;
            border: 4px solid #FF10F0;
            box-shadow: 
                0 0 20px rgba(255, 16, 240, 0.5),
                inset 0 0 20px rgba(0, 0, 0, 0.5);
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            min-width: 200px;
        }

        .info-panel {
            background: rgba(0, 0, 0, 0.5);
            border: 3px solid #00F0FF;
            padding: 1rem;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        .info-panel h2 {
            font-size: 0.7rem;
            color: #00F0FF;
            margin-bottom: 0.8rem;
            text-align: center;
            text-shadow: 0 0 10px #00F0FF;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.6rem;
            font-size: 0.5rem;
        }

        .stat-label {
            color: #FFFF00;
        }

        .stat-value {
            color: #39FF14;
            text-shadow: 0 0 5px #39FF14;
        }

        #nextPieceCanvas {
            display: block;
            margin: 0 auto;
            background: #000000;
            border: 2px solid #FF10F0;
            box-shadow: 0 0 10px rgba(255, 16, 240, 0.3);
        }

        .controls-panel {
            background: rgba(0, 0, 0, 0.5);
            border: 3px solid #FFFF00;
            padding: 1rem;
            box-shadow: 0 0 20px rgba(255, 255, 0, 0.3);
        }

        .controls-panel h2 {
            font-size: 0.7rem;
            color: #FFFF00;
            margin-bottom: 0.8rem;
            text-align: center;
            text-shadow: 0 0 10px #FFFF00;
        }

        .controls-panel p {
            font-size: 0.4rem;
            color: #00F0FF;
            line-height: 1.6;
            margin-bottom: 0.4rem;
        }

        .game-controls {
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .pixel-btn {
            padding: 0.6rem 1rem;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.5rem;
            color: #000;
            background: #FF10F0;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.3s ease;
            box-shadow: 
                0 4px 0 0 #a00a9c,
                0 0 20px rgba(255, 16, 240, 0.5);
            width: 100%;
        }

        .pixel-btn:hover {
            transform: translateY(2px);
            box-shadow: 
                0 2px 0 0 #a00a9c,
                0 0 30px rgba(255, 16, 240, 0.8);
        }

        .pixel-btn:active {
            transform: translateY(4px);
            box-shadow: 
                0 0 0 0 #a00a9c,
                0 0 20px rgba(255, 16, 240, 0.8);
        }

        .pixel-btn.secondary {
            background: #00F0FF;
            box-shadow: 
                0 4px 0 0 #0099a6,
                0 0 20px rgba(0, 240, 255, 0.5);
        }

        .pixel-btn.secondary:hover {
            box-shadow: 
                0 2px 0 0 #0099a6,
                0 0 30px rgba(0, 240, 255, 0.8);
        }

        .pixel-btn.secondary:active {
            box-shadow: 
                0 0 0 0 #0099a6,
                0 0 20px rgba(0, 240, 255, 0.8);
        }

        .level-indicator {
            display: flex;
            gap: 0.3rem;
            margin-top: 0.5rem;
        }

        .level-dot {
            width: 8px;
            height: 8px;
            background: #333;
            border: 1px solid #666;
        }

        .level-dot.active {
            background: #39FF14;
            box-shadow: 0 0 5px #39FF14;
        }

        @media (max-width: 768px) {
            .game-wrapper {
                flex-direction: column;
                align-items: center;
            }

            .sidebar {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                min-width: auto;
            }

            .info-panel, .controls-panel {
                flex: 1;
                min-width: 250px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1rem;
            }

            .sidebar {
                flex-direction: column;
            }

            .info-panel, .controls-panel {
                min-width: auto;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="main-game">
            <h1>🎮 TETRIS</h1>
            <canvas id="gameCanvas" width="300" height="600"></canvas>
            <div class="game-controls">
                <button class="pixel-btn" id="startBtn">▶ START</button>
                <button class="pixel-btn" id="pauseBtn">⏸ PAUSE</button>
                <button class="pixel-btn" id="restartBtn">🔄 RESTART</button>
                <button class="pixel-btn secondary" id="backBtn">← MENU</button>
            </div>
        </div>

        <div class="sidebar">
            <div class="info-panel">
                <h2>STATISTICS</h2>
                <div class="stat-row">
                    <span class="stat-label">SCORE:</span>
                    <span class="stat-value" id="score">0</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">LINES:</span>
                    <span class="stat-value" id="lines">0</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">LEVEL:</span>
                    <span class="stat-value" id="level">1</span>
                </div>
                <div class="level-indicator" id="levelDots"></div>
                <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #333;">
                    <div class="stat-row">
                        <span class="stat-label">HIGH:</span>
                        <span class="stat-value" id="highScore">0</span>
                    </div>
                </div>
                
                <h2 style="margin-top: 1.5rem;">NEXT PIECE</h2>
                <canvas id="nextPieceCanvas" width="120" height="120"></canvas>
            </div>

            <div class="controls-panel">
                <h2>CONTROLS</h2>
                <p>← → MOVE LEFT/RIGHT</p>
                <p>↓ SOFT DROP</p>
                <p>SPACE HARD DROP</p>
                <p>↑ / Z ROTATE LEFT</p>
                <p>X ROTATE RIGHT</p>
                <p>P / PAUSE PAUSE</p>
                <p>R RESTART</p>
                <p></p>
                <p style="color: #39FF14;">CLEAR LINES TO SCORE!</p>
                <p style="color: #FF10F0;">4 LINES = TETRIS!</p>
            </div>
        </div>
    </div>

    <!-- Core Engine Scripts -->
    <script src="../../core/game-engine.js"></script>
    <script src="../../core/input-handler.js"></script>
    <script src="../../core/renderer.js"></script>
    <script src="../../core/collision-detector.js"></script>
    <script src="../../core/audio-manager.js"></script>
    
    <!-- Tetris Game Script -->
    <script src="tetris.js"></script>
</body>
</html>
