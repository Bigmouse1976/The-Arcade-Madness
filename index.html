<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Arcade Madness - Classic Games Collection</title>
    <meta name="description" content="Play classic arcade games online! Tetris, Snake, Sokoban, and Pac-Man - all playable in your browser.">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/games.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Animated background canvas -->
    <canvas id="backgroundCanvas"></canvas>
    
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="glitch-wrapper">
                <h1 class="glitch" data-text="THE ARCADE MADNESS">THE ARCADE MADNESS</h1>
            </div>
            <p class="subtitle pixel-text">CLASSIC GAMES • ENDLESS FUN • PURE NOSTALGIA</p>
            <div class="retro-line"></div>
        </header>
        
        <!-- Game Selection Grid -->
        <main id="game-selection" class="game-grid">
            <!-- Games will be injected here by JavaScript -->
        </main>
        
        <!-- Footer -->
        <footer class="footer">
            <div class="pixel-border"></div>
            <p class="pixel-text">© 2026 THE ARCADE MADNESS</p>
            <p class="pixel-text small">CRAFTED WITH ❤️ AND JAVASCRIPT</p>
            <div class="social-links">
                <a href="https://github.com/yourusername/arcade-madness" target="_blank" class="pixel-btn">
                    <span class="btn-icon">⭐</span> GITHUB
                </a>
            </div>
        </footer>
    </div>
    
    <!-- Scripts -->
    <script src="js/core/animated-background.js"></script>
    <script src="js/ui/menu.js"></script>
</body>
</html>
